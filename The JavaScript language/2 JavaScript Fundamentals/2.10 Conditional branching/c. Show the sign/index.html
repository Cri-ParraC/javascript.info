<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show the sign</title>
</head>

<body>
  <script>
    const numero = prompt('Ingrese un número:');
    if (numero > 0) {
      alert(1);
    } else if (numero < 0) {
      alert(-1);
    } else {
      alert(0);
    }
  </script>
</body>

</html>
