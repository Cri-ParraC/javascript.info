<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The name of JavaScript
  </title>

<body>
  <script>
    const respuesta = prompt('What is the “official” name of JavaScript ?');

      alert('Right!');
    } else {
      alert('You don’t know? ECMAScript!');
    }
  </script>
